name: Publish DeweyYe to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # The Pages API can lag behind the artifact upload response.
      - name: Wait for the Pages artifact to become visible
        run: sleep 15
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
