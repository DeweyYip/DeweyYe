<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Game — DeweyYe</title>
  <link rel="stylesheet" href="../../assets/editorial.css?v=7">

<body class="">
<main class="shell game-shell">

  <h1>Game</h1>
  <div class="game-grid">
    <figure>
      <div class="game-art spirit-art">
        <img src="../../assets/images/games/planet-0.webp" width="1065" height="1477" alt="A creature with a star-shaped tail glowing pink against deep blue">

    <figure>
      <button class="game-art cake-art" id="squish" type="button" aria-label="Press to squish the cheesecake">

        <span class="release">COMING IN DECEMBER</span>

      <figcaption class="slime-title">Slime Blindbox</figcaption>
    </figure>
  </div>
